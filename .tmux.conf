# ============================================================================
# .tmux.conf - Visual & aesthetic tmux configuration (no extra dependencies)
# ============================================================================

# --- Terminal & Color Support ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- General Behavior ---
set -g history-limit 10000        # Larger scrollback buffer
set -g display-time 2000          # Status messages visible for 2s
set -g focus-events on            # Pass focus events to apps (e.g. vim)
set -sg escape-time 10            # Faster escape key recognition (helps vim)
set -g base-index 1               # Windows start at 1 (more natural)
setw -g pane-base-index 1         # Panes start at 1
set -g renumber-windows on        # Renumber windows when one is closed

# --- Status Bar ---
set -g status on
set -g status-interval 5          # Refresh every 5 seconds
set -g status-position bottom
set -g status-justify left

# Colors (uses terminal 256-color palette, no plugins required)
set -g status-style "bg=colour235,fg=colour250"

# Left side: session name
set -g status-left-length 30
set -g status-left "#[bg=colour24,fg=colour255,bold] #S #[bg=colour235,fg=colour24]"

# Right side: host and time
set -g status-right-length 60
set -g status-right "#[fg=colour242]%Y-%m-%d  #[fg=colour250]%H:%M #[bg=colour24,fg=colour255,bold] #h "

# Window tabs
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=colour31,fg=colour255,bold] #I:#W "
setw -g window-status-style          "bg=colour235,fg=colour244"
setw -g window-status-current-style  "bg=colour31,fg=colour255,bold"
setw -g window-status-activity-style "bg=colour235,fg=colour166,bold"

# --- Pane Borders ---
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# --- Message / Command Bar ---
set -g message-style        "bg=colour24,fg=colour255,bold"
set -g message-command-style "bg=colour24,fg=colour255"

# --- Window & Pane Titles ---
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g automatic-rename on       # Rename windows to current command

# --- Visual Activity ---
setw -g monitor-activity on       # Highlight windows with activity
set -g visual-activity off        # Don't show a message, just highlight
